- id: error_fix.no_upstream
  class: error_fix
  vars: {u: {gen: user}, rp: {gen: project}, br: {gen: branch}}
  setup: ["fx_remote {u}/{rp} python", "git clone -q https://github.com/{u}/{rp}", "cd {rp}", "git checkout -q -b {br}", "echo x >> README.md", "git commit -q -am wip"]
  steps:
    - {cmd: "git push", expect: fail}
    - {cmd: "git push --set-upstream origin {br}", target: true}
- id: error_fix.not_found_apt
  class: error_fix
  vars: {t: {gen: apt}, w: {gen: word}}
  steps:
    - {cmd: "{t[0]} {w}", expect: fail}
    - {cmd: "sudo apt install {t[1]}", target: true}
- id: error_fix.typo_git
  class: error_fix
  vars: {ty: {choice: [stauts, staus, comit, psuh, pul, chekout, brach, fecth, lgo, dif]}, fix: {fmt: "x"}}
  setup: ["git init -q"]
  steps:
    - {cmd: "git {ty}", expect: fail}
    - {cmd: "git status", target: true}
- id: error_fix.exec_denied
  class: error_fix
  vars: {f: {gen: file_sh}}
  setup: ["echo 'echo hi' > {f}"]
  steps:
    - {cmd: "./{f}", expect: fail}
    - {cmd: "chmod +x {f}", target: true}
    - {cmd: "./{f}"}
- id: error_fix.venv_pip
  class: error_fix
  vars: {p: {gen: pip}}
  steps:
    - {cmd: "pip install {p}", expect: fail}
    - {cmd: "python3 -m venv .venv", target: true}
    - {cmd: "source .venv/bin/activate", target: true}
    - {cmd: "pip install {p}"}
